<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multivariate Time Series & Dendrogram Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

        :root {
            --bg: #f5f4f0;
            --surface: #ffffff;
            --surface2: #f0eeea;
            --border: #d4cfc6;
            --text: #1a1a2e;
            --text-dim: #7a7a8c;
            --accent: #1a56db;
            --accent2: #e53e3e;
            --green: #1a7f5a;
            --yellow: #b45309;
            --purple: #6d28d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            font-size: 12px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .page-header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .page-header p {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .section-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            background: rgba(26, 86, 219, 0.08);
            border: 1px solid rgba(26, 86, 219, 0.25);
            padding: 2px 8px;
            border-radius: 2px;
        }

        h2 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        h3 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .phase-group {
            display: inline-block;
            margin-right: 12px;
            vertical-align: top;
        }

        .axis text {
            font-size: 9px;
            fill: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
        }

        .axis path, .axis line {
            stroke: var(--border);
        }

        .line { fill: none; stroke-width: 1.5px; opacity: 0.75; }
        .line:hover { stroke-width: 2.5px; opacity: 1; cursor: pointer; }

        .tooltip {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 3px;
            pointer-events: none;
            font-size: 11px;
            opacity: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 100;
            line-height: 1.6;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text);
            max-width: 260px;
        }

        .tooltip strong { color: var(--accent); }
        .tooltip em { color: var(--text-dim); font-style: normal; }

        .event-line { stroke: var(--accent2); stroke-width: 1px; stroke-dasharray: 3,3; opacity: 0.45; }
        .event-hotspot { stroke: transparent; stroke-width: 12px; cursor: pointer; }

        .dendro-link { fill: none; stroke: var(--border); stroke-width: 1.5px; transition: stroke 0.2s, stroke-width 0.2s; }
        .dendro-link.active { stroke: var(--accent); stroke-width: 3px; }
        .cell { transition: opacity 0.2s; }
        .cell.dimmed { opacity: 0.1; }

        #overview-charts { margin-top: 8px; }

        .overview-row {
            margin-bottom: 20px;
        }

        .overview-row h3 {
            margin-bottom: 8px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
        }

        .legend-swatch {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-label { font-size: 10px; }

        .phase-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 8px;
            fill: var(--text-dim);
        }

        #req4-charts {
            display: flex;
            flex-direction: column;
        }

        .metric-analysis-block { margin-bottom: 48px; }

        .metric-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        .dendro-panel {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 16px;
            min-width: 280px;
            max-width: 320px;
            flex-shrink: 0;
        }

        .dendro-panel-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .dendro-panel-empty {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            padding: 40px 0;
            line-height: 1.8;
        }

        .phase-shade {
            opacity: 0.07;
            fill: var(--accent);
        }

        /* Phase sub-section legend */
        .phase-section-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            padding: 7px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            align-items: center;
        }

        /* Cross-highlight dot */
        .cross-dot {
            pointer-events: none;
            transition: opacity 0.15s;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Wikipedia & Google Trends — Longitudinal Analysis</h1>
        <p>Search · View · Edit signals across language editions — 2025</p>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <!-- SECTION 0: Full Year Overview -->
    <div class="section">
        <div class="section-header">
            <span class="section-number">00</span>
            <h2>Full-Year Overview — 2025</h2>
        </div>
        <div id="overview-legend" class="legend"></div>
        <div id="overview-charts"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">01–02</span>
            <h2>Language-Specific Trends (Search, View, Edit)</h2>
        </div>
        <div id="req12-charts"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">03</span>
            <h2>Category-Specific Trends — Cross-Language, Normalized</h2>
        </div>
        <div id="req3-charts"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">04</span>
            <h2>Correlation Heatmap & Dendrogram</h2>
        </div>
        <div id="req4-charts"></div>
    </div>

    <script>
        const tooltip = d3.select("#tooltip");
        const showTooltip = (html, e) => tooltip.style("opacity", 1).html(html)
            .style("left", (e.pageX + 15) + "px").style("top", (e.pageY - 15) + "px");
        const hideTooltip = () => tooltip.style("opacity", 0);

        // Phase labels updated as requested
        const phases = [
            { name: "P1: Israeli Airstrikes → Ceasefire", shortName: "P1", start: new Date(2025, 0, 1), end: new Date(2025, 0, 31) },
            { name: "P2: Twelve Day War / US-Brokered Ceasefire", shortName: "P2", start: new Date(2025, 5, 1), end: new Date(2025, 5, 30) },
            { name: "P3: Netanyahu Speech & Ceasefire", shortName: "P3", start: new Date(2025, 8, 1), end: new Date(2025, 9, 31) }
        ];

        const baseFolder = "final_data/google_trends/";
        const trendFiles = [
            { name: "Sweden", path: baseFolder + "sweden.csv" },
            { name: "Italy", path: baseFolder + "italy.csv" },
            { name: "Poland", path: baseFolder + "poland.csv" },
            { name: "Russia", path: baseFolder + "russia.csv" },
            { name: "Worldwide", path: baseFolder + "worldwide.csv" }
        ];

        const promises = [
            d3.csv("events.csv"),
            d3.csv("wikipedia_views.csv"),
            d3.csv("wikipedia_edits.csv")
        ];
        trendFiles.forEach(f => promises.push(d3.csv(f.path)));

        Promise.all(promises).then(datasets => {
            const eventsRaw = datasets[0];
            const viewsRaw = datasets[1];
            const editsRaw = datasets[2];
            const googleTrendsRaw = datasets.slice(3);

            const events = eventsRaw.map(d => ({ date: new Date(d.Date), desc: d.Event || d.Description || d.Name }));
            const parseVal = (v) => (typeof v === 'string' && v.includes('<1')) ? 0 : +v;

            const allData = [];

            const processWiki = (data, type) => {
                data.forEach(d => allData.push({ date: new Date(d.Date), country: d.Country, val: +d.Interest, type }));
            };
            processWiki(viewsRaw, "View");
            processWiki(editsRaw, "Edit");

            googleTrendsRaw.forEach((data, i) => {
                const countryName = trendFiles[i].name;
                data.forEach(row => {
                    const cleanRow = {};
                    for (let key in row) cleanRow[key.trim()] = row[key];
                    const dateKey = cleanRow.hasOwnProperty('Time') ? 'Time' : 'Date';
                    const valueKey = Object.keys(cleanRow).find(k => k !== dateKey && k !== 'Country');
                    allData.push({ date: new Date(cleanRow[dateKey]), country: countryName, val: parseVal(cleanRow[valueKey]), type: "Search" });
                });
            });

            const countries = trendFiles.map(d => d.name);
            const types = ["Search", "View", "Edit"];

            const typeColors = { "Search": "#1a7f5a", "View": "#1a56db", "Edit": "#6d28d9" };
            const countryColors = d3.scaleOrdinal()
                .domain(countries)
                .range(["#1a56db", "#b45309", "#1a7f5a", "#e53e3e", "#6d28d9"]);

            const normalize = (data) => {
                const min = d3.min(data, d => d.val), max = d3.max(data, d => d.val);
                return data.map(d => ({ ...d, normVal: max > min ? (d.val - min) / (max - min) : 0 }));
            };

            const yearStart = new Date(2025, 0, 1);
            const yearEnd = new Date(2025, 11, 31);

            let phasedData = [];
            phases.forEach((p, pIdx) => {
                countries.forEach(c => {
                    types.forEach(t => {
                        const subset = allData.filter(d => d.country === c && d.type === t && d.date >= p.start && d.date <= p.end);
                        if (subset.length > 0) phasedData.push(...normalize(subset).map(d => ({ ...d, phaseIdx: pIdx })));
                    });
                });
            });

            // ============================================================
            // CROSS-HIGHLIGHT SYSTEM
            // Each subplot registers itself with a phaseIdx so dots only
            // appear in other subplots that share the SAME phase.
            //
            // Registry entry shape:
            //   key (string, unique per subplot SVG) →
            //     { svgG, xScale, yScale, phaseIdx, groupKey, data }
            //
            // groupKey = 'type'    → data grouped by metric type  (Section 01-02)
            // groupKey = 'country' → data grouped by country      (Section 03)
            // ============================================================

            // Map<key, {svgG, xScale, yScale, phaseIdx, groupKey, data}>
            const subplotRegistry = new Map();

            const registerSubplot = (key, svgG, xScale, yScale, phaseIdx, groupKey, data) => {
                subplotRegistry.set(key, { svgG, xScale, yScale, phaseIdx, groupKey, data });
            };

            const clearCrossDots = () => d3.selectAll(".cross-dot").remove();

            // Show cross-dots on all OTHER subplots that share the same phaseIdx.
            // targetDate  – the hovered date in the SOURCE subplot
            // sourceKey   – skip this subplot (it's the one being hovered)
            // sourcePhase – only highlight subplots whose phaseIdx matches
            const crossHighlightDate = (targetDate, sourceKey, sourcePhase) => {
                clearCrossDots();
                subplotRegistry.forEach((entry, key) => {
                    if (key === sourceKey) return;
                    if (entry.phaseIdx !== sourcePhase) return;   // ← same-phase gate

                    const grouped = d3.group(entry.data, d => d[entry.groupKey]);
                    grouped.forEach((pts, grpVal) => {
                        // find point in this series closest to targetDate
                        const closest = pts.reduce((best, d) =>
                            Math.abs(d.date - targetDate) < Math.abs(best.date - targetDate) ? d : best
                        , pts[0]);

                        const x = entry.xScale(closest.date);
                        const y = entry.yScale(closest.normVal);
                        if (isNaN(x) || isNaN(y)) return;

                        const color = entry.groupKey === 'type'
                            ? typeColors[grpVal]
                            : countryColors(grpVal);

                        entry.svgG.append("circle")
                            .attr("class", "cross-dot")
                            .attr("cx", x).attr("cy", y)
                            .attr("r", 3.5)
                            .attr("fill", color)
                            .attr("stroke", "white")
                            .attr("stroke-width", 1.5)
                            .attr("opacity", 0.9);
                    });
                });
            };

            // ============================================================
            // SECTION 0: FULL YEAR OVERVIEW
            // ============================================================
            const buildOverview = () => {
                const legendDiv = d3.select("#overview-legend");
                types.forEach(t => {
                    legendDiv.append("div").attr("class", "legend-item")
                        .html(`<div class="legend-swatch" style="background:${typeColors[t]}"></div><span class="legend-label">${t}</span>`);
                });
                legendDiv.append("div").style("width","1px").style("background","var(--border)").style("height","16px").style("margin","0 4px");
                countries.forEach(c => {
                    legendDiv.append("div").attr("class", "legend-item")
                        .html(`<div class="legend-swatch" style="background:${countryColors(c)}"></div><span class="legend-label">${c}</span>`);
                });

                const overviewDiv = d3.select("#overview-charts");
                const margin = { top: 40, right: 20, bottom: 35, left: 40 };
                const w = 880 - margin.left - margin.right;
                const h = 120 - margin.top - margin.bottom;

                countries.forEach(c => {
                    const row = overviewDiv.append("div").attr("class", "overview-row");
                    row.append("h3").text(`${c}`);

                    const svg = row.append("svg")
                        .attr("width", w + margin.left + margin.right)
                        .attr("height", h + margin.top + margin.bottom)
                        .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

                    const xScale = d3.scaleTime().domain([yearStart, yearEnd]).range([0, w]);
                    const yScale = d3.scaleLinear().domain([0, 1]).range([h, 0]);

                    // Phase shading
                    phases.forEach(p => {
                        svg.append("rect")
                            .attr("class", "phase-shade")
                            .attr("x", xScale(p.start))
                            .attr("y", 0)
                            .attr("width", xScale(p.end) - xScale(p.start))
                            .attr("height", h);

                        const midX = xScale(p.start) + (xScale(p.end) - xScale(p.start)) / 2;
                        // Two-line label: shortName on first line, rest on second
                        svg.append("text")
                            .attr("class", "phase-label")
                            .attr("x", midX)
                            .attr("y", -24)
                            .attr("text-anchor", "middle")
                            .style("font-weight", "600")
                            .style("fill", "var(--accent)")
                            .text(p.shortName + ":");

                        // Wrap the long label into two lines
                        const words = p.name.replace(/^P\d+: /, '').split(' ');
                        const mid = Math.ceil(words.length / 2);
                        svg.append("text")
                            .attr("class", "phase-label")
                            .attr("x", midX)
                            .attr("y", -14)
                            .attr("text-anchor", "middle")
                            .text(words.slice(0, mid).join(' '));
                        svg.append("text")
                            .attr("class", "phase-label")
                            .attr("x", midX)
                            .attr("y", -5)
                            .attr("text-anchor", "middle")
                            .text(words.slice(mid).join(' '));
                    });

                    svg.append("g").attr("class", "axis grid")
                        .attr("transform", `translate(0,${h})`)
                        .call(d3.axisBottom(xScale).ticks(d3.timeMonth.every(1)).tickFormat(d3.timeFormat("%b")))
                        .call(g => g.select(".domain").remove());

                    svg.append("g").attr("class", "axis")
                        .call(d3.axisLeft(yScale).ticks(3).tickFormat(d => d === 0 ? "0" : d === 1 ? "1" : ""))
                        .call(g => g.select(".domain").remove());

                    // Events with visible dashed line + tooltip (same as phase subplots)
                    events.filter(e => e.date >= yearStart && e.date <= yearEnd).forEach(e => {
                        const x = xScale(e.date);
                        svg.append("line").attr("class", "event-line")
                            .attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", h);
                        svg.append("circle")
                            .attr("cx", x).attr("cy", h).attr("r", 2.5)
                            .style("fill", "var(--accent2)").style("opacity", 0.55)
                            .style("pointer-events", "none");
                        // Wide invisible hit target for easy hovering
                        svg.append("line").attr("class", "event-hotspot")
                            .attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", h)
                            .on("mouseover", ev => showTooltip(
                                `<strong>Event</strong><br/>${e.desc}<br/><em>${e.date.toDateString()}</em>`, ev))
                            .on("mouseout", hideTooltip);
                    });

                    const lineGen = d3.line()
                        .defined(d => !isNaN(d.normVal))
                        .x(d => xScale(d.date))
                        .y(d => yScale(d.normVal))
                        .curve(d3.curveMonotoneX);

                    types.forEach(t => {
                        const subset = allData.filter(d => d.country === c && d.type === t
                            && d.date >= yearStart && d.date <= yearEnd);
                        const normed = normalize(subset);
                        if (normed.length === 0) return;

                        svg.append("path").datum(normed)
                            .attr("class", "line")
                            .attr("stroke", typeColors[t])
                            .attr("d", lineGen)
                            .on("mousemove", function(event) {
                                const [mx] = d3.pointer(event);
                                const hovDate = xScale.invert(mx);
                                // Find closest data point for value readout
                                const closest = normed.reduce((best, d) =>
                                    Math.abs(d.date - hovDate) < Math.abs(best.date - hovDate) ? d : best
                                , normed[0]);
                                showTooltip(
                                    `<strong>${c} — ${t}</strong><br/>`
                                    + `${d3.timeFormat("%b %d")(closest.date)}<br/>`
                                    + `Normalized: ${closest.normVal.toFixed(2)}`,
                                    event);
                            })
                            .on("mouseleave", hideTooltip);
                    });
                });
            };

            buildOverview();

            // ============================================================
            // SECTION 1 & 2: Phase subplots
            // ============================================================
            const drawSubplot = (container, data, xDomain, colorScale, title, groupKey, regKey, phaseIdx) => {
                const margin = { top: 25, right: 15, bottom: 25, left: 35 };
                const w = 240 - margin.left - margin.right, h = 150 - margin.top - margin.bottom;
                const svg = container.append("svg")
                    .attr("width", w + margin.left + margin.right)
                    .attr("height", h + margin.top + margin.bottom)
                    .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

                svg.append("text").attr("x", w / 2).attr("y", -10).attr("text-anchor", "middle")
                    .style("font-family", "'IBM Plex Mono', monospace")
                    .style("font-size", "10px").style("fill", "var(--text-dim)").text(title);

                const xScale = d3.scaleTime().domain(xDomain).range([0, w]);
                const yScale = d3.scaleLinear().domain([0, 1]).range([h, 0]);

                svg.append("g").attr("class", "axis").attr("transform", `translate(0,${h})`)
                    .call(d3.axisBottom(xScale).ticks(3).tickFormat(d3.timeFormat("%b %d")))
                    .call(g => g.select(".domain").attr("stroke", "var(--border)"));
                svg.append("g").attr("class", "axis")
                    .call(d3.axisLeft(yScale).ticks(3))
                    .call(g => g.select(".domain").attr("stroke", "var(--border)"));

                events.filter(e => e.date >= xDomain[0] && e.date <= xDomain[1]).forEach(e => {
                    const x = xScale(e.date);
                    svg.append("line").attr("class", "event-line").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", h);
                    svg.append("circle").attr("cx", x).attr("cy", h).attr("r", 2.5).style("fill", "var(--accent2)").style("opacity", 0.5)
                        .style("pointer-events", "none");
                    svg.append("line").attr("class", "event-hotspot").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", h)
                        .on("mouseover", ev => showTooltip(`<strong>Event</strong><br/>${e.desc}<br/><em>${e.date.toDateString()}</em>`, ev))
                        .on("mouseout", hideTooltip);
                });

                const lineGen = d3.line().x(d => xScale(d.date)).y(d => yScale(d.normVal)).curve(d3.curveMonotoneX);
                const grouped = d3.group(data, d => d[groupKey]);

                // Register this subplot with its phase index and full data
                if (regKey !== undefined) {
                    registerSubplot(regKey, svg, xScale, yScale, phaseIdx, groupKey, data);
                }

                grouped.forEach((pts, key) => {
                    svg.append("path").datum(pts).attr("class", "line")
                        .attr("stroke", colorScale(key))
                        .attr("d", lineGen)
                        .on("mousemove", function(event) {
                            const [mx] = d3.pointer(event);
                            const hovDate = xScale.invert(mx);
                            const closest = pts.reduce((best, d) =>
                                Math.abs(d.date - hovDate) < Math.abs(best.date - hovDate) ? d : best
                            , pts[0]);
                            showTooltip(
                                `<strong>${key}</strong><br/>`
                                + `${d3.timeFormat("%b %d")(closest.date)}<br/>`
                                + `Normalized: ${closest.normVal.toFixed(2)}`,
                                event);
                            crossHighlightDate(hovDate, regKey, phaseIdx);
                        })
                        .on("mouseleave", () => { hideTooltip(); clearCrossDots(); });
                });

                return { svg, xScale, yScale };
            };

            // Build req12 (country → type by phase)
            countries.forEach(c => {
                const row = d3.select("#req12-charts").append("div").style("margin-bottom", "16px");
                row.append("h3").text(c);

                // Small per-country legend (type colors)
                const legRow = row.append("div").attr("class", "phase-section-legend");
                types.forEach(t => {
                    legRow.append("div").attr("class", "legend-item")
                        .html(`<div class="legend-swatch" style="background:${typeColors[t]}"></div><span class="legend-label">${t}</span>`);
                });

                phases.forEach((p, i) => {
                    const wrap = row.append("div").attr("class", "phase-group");
                    const regKey = `${c}__type__${i}`;
                    drawSubplot(wrap, phasedData.filter(d => d.country === c && d.phaseIdx === i), [p.start, p.end], d => typeColors[d], p.shortName, "type", regKey, i);
                });
            });

            // Build req3 (type → country by phase)
            types.forEach(t => {
                const row = d3.select("#req3-charts").append("div").style("margin-bottom", "16px");
                row.append("h3").text(`${t} Behavior Across Languages`);

                // Small per-type legend (country colors)
                const legRow = row.append("div").attr("class", "phase-section-legend");
                countries.forEach(c => {
                    legRow.append("div").attr("class", "legend-item")
                        .html(`<div class="legend-swatch" style="background:${countryColors(c)}"></div><span class="legend-label">${c}</span>`);
                });

                phases.forEach((p, i) => {
                    const wrap = row.append("div").attr("class", "phase-group");
                    const regKey = `${t}__country__${i}`;
                    drawSubplot(wrap, phasedData.filter(d => d.type === t && d.phaseIdx === i), [p.start, p.end], countryColors, p.shortName, "country", regKey, i);
                });
            });

            // ============================================================
            // SECTION 4: Heatmap + Dendrogram + Side Panel
            // ============================================================
            const pearson = (a, b) => {
                const mA = d3.mean(a), mB = d3.mean(b);
                let num = 0, dA = 0, dB = 0;
                for (let i = 0; i < a.length; i++) {
                    num += (a[i] - mA) * (b[i] - mB);
                    dA += Math.pow(a[i] - mA, 2);
                    dB += Math.pow(b[i] - mB, 2);
                }
                return (dA === 0 || dB === 0) ? 0 : num / (Math.sqrt(dA) * Math.sqrt(dB));
            };

            const generateMetricDashboard = (metricType, activeCountries) => {
                const blockId = `block-${metricType}`;
                const panelId = `panel-${metricType}`;

                const container = d3.select("#req4-charts").append("div")
                    .attr("class", "metric-analysis-block")
                    .attr("id", blockId);

                container.append("h3").text(`${metricType} — Similarity & Clustering`);

                const metricVectors = {};
                activeCountries.forEach(c => metricVectors[c] = []);
                const metricDates = Array.from(new Set(
                    phasedData.filter(d => d.type === metricType).map(d => d.date.getTime())
                )).sort();

                activeCountries.forEach(c => {
                    const subset = phasedData.filter(d => d.country === c && d.type === metricType);
                    const lookup = new Map(subset.map(d => [d.date.getTime(), d.normVal]));
                    metricDates.forEach(dk => metricVectors[c].push(lookup.get(dk) || 0));
                });

                const metricDistMatrix = {};
                activeCountries.forEach(c1 => {
                    metricDistMatrix[c1] = {};
                    activeCountries.forEach(c2 => {
                        const r = pearson(metricVectors[c1], metricVectors[c2]);
                        metricDistMatrix[c1][c2] = 1 - (isNaN(r) ? 0 : r);
                    });
                });

                // UPGMA
                let metricClusters = activeCountries.map(id => ({ id, name: id, leaves: [id], height: 0 }));
                while (metricClusters.length > 1) {
                    let minD = Infinity, pair = [0, 1];
                    for (let i = 0; i < metricClusters.length; i++) {
                        for (let j = i + 1; j < metricClusters.length; j++) {
                            let sum = 0, cnt = 0;
                            metricClusters[i].leaves.forEach(l1 => metricClusters[j].leaves.forEach(l2 => {
                                sum += metricDistMatrix[l1][l2]; cnt++;
                            }));
                            const avgD = sum / cnt;
                            if (avgD < minD) { minD = avgD; pair = [i, j]; }
                        }
                    }
                    const [i, j] = pair;
                    metricClusters.push({
                        id: metricType + "_" + metricClusters[i].id + "_" + metricClusters[j].id,
                        children: [metricClusters[i], metricClusters[j]],
                        leaves: [...metricClusters[i].leaves, ...metricClusters[j].leaves],
                        height: minD / 2
                    });
                    metricClusters.splice(j, 1);
                    metricClusters.splice(i, 1);
                }

                const metricRoot = d3.hierarchy(metricClusters[0]);
                const metricLeafOrder = metricRoot.leaves().map(d => d.data.id);
                const hmSize = 360, dendroW = 130, labelSpace = 90;

                const rowDiv = container.append("div").attr("class", "metric-row");
                const leftDiv = rowDiv.append("div");
                const panelDiv = rowDiv.append("div")
                    .attr("class", "dendro-panel")
                    .attr("id", panelId);

                panelDiv.append("div").attr("class", "dendro-panel-header").text("Cluster Detail");
                panelDiv.append("div").attr("class", "dendro-panel-empty")
                    .html("Hover a node<br/>on the dendrogram<br/>to compare countries");

                const svg = leftDiv.append("svg")
                    .attr("width", hmSize + dendroW + labelSpace + 80)
                    .attr("height", hmSize + 100);

                const gHm = svg.append("g").attr("transform", "translate(60, 80)");
                const gDendro = svg.append("g").attr("transform", `translate(${hmSize + 60 + labelSpace}, 80)`);

                const grid = d3.scaleBand().domain(metricLeafOrder).range([0, hmSize]).padding(0.02);
                const colorScaleHm = d3.scaleSequential(d3.interpolateRdYlBu).domain([2, 0]);

                metricLeafOrder.forEach(r => {
                    metricLeafOrder.forEach(c => {
                        const dv = metricDistMatrix[r][c];
                        gHm.append("rect")
                            .attr("class", `cell cell-${metricType} cell-${metricType}-${r.replace(/\s+/g, '')}`)
                            .attr("x", grid(c)).attr("y", grid(r))
                            .attr("width", grid.bandwidth()).attr("height", grid.bandwidth())
                            .attr("fill", colorScaleHm(dv))
                            .on("mouseover", e => showTooltip(`<strong>${metricType}</strong><br/>${r} & ${c}<br/>r = ${(1 - dv).toFixed(3)}`, e))
                            .on("mouseout", hideTooltip);
                    });

                    gHm.append("text").attr("x", hmSize + 8).attr("y", grid(r) + grid.bandwidth() / 2 + 4)
                        .style("font-family", "'IBM Plex Mono', monospace").style("font-weight", "600")
                        .style("font-size", "10px").style("fill", "var(--text)").text(r);

                    gHm.append("text")
                        .attr("x", grid(r) + grid.bandwidth() / 2).attr("y", -8)
                        .attr("text-anchor", "start")
                        .attr("transform", `rotate(-40, ${grid(r) + grid.bandwidth() / 2}, -8)`)
                        .style("font-family", "'IBM Plex Mono', monospace")
                        .style("font-size", "9px").style("fill", "var(--text-dim)").text(r);
                });

                const defs = svg.append("defs");
                const gradId = `grad-${metricType}`;
                const grad = defs.append("linearGradient").attr("id", gradId).attr("x1", "0%").attr("x2", "100%");
                d3.range(0, 1.01, 0.1).forEach(t => {
                    grad.append("stop").attr("offset", `${t * 100}%`).attr("stop-color", colorScaleHm(t * 2));
                });
                gHm.append("rect").attr("x", 0).attr("y", hmSize + 12)
                    .attr("width", hmSize).attr("height", 8)
                    .attr("fill", `url(#${gradId})`).attr("rx", 2);
                gHm.append("text").attr("x", 0).attr("y", hmSize + 28).style("font-size", "9px")
                    .style("fill", "var(--text-dim)").style("font-family", "'IBM Plex Mono', monospace").text("r = 1 (identical)");
                gHm.append("text").attr("x", hmSize).attr("y", hmSize + 28).attr("text-anchor", "end")
                    .style("font-size", "9px").style("fill", "var(--text-dim)").style("font-family", "'IBM Plex Mono', monospace").text("r = -1 (inverse)");

                const clusterLayout = d3.cluster().size([hmSize, dendroW]);
                clusterLayout(metricRoot);
                metricRoot.each(d => { d.y = dendroW - d.y; });

                const linkGen = d3.linkHorizontal().x(d => d.y).y(d => d.x);
                const links = gDendro.selectAll(".dendro-link")
                    .data(metricRoot.links()).enter().append("path")
                    .attr("class", "dendro-link").attr("d", linkGen);

                const nodes = gDendro.selectAll(".dendro-node")
                    .data(metricRoot.descendants()).enter().append("g")
                    .attr("class", "dendro-node")
                    .attr("transform", d => `translate(${d.y}, ${d.x})`);

                nodes.append("circle").attr("r", 4)
                    .attr("fill", d => d.children ? "var(--surface2)" : "var(--surface)")
                    .attr("stroke", d => d.children ? "var(--text-dim)" : countryColors(d.data.id))
                    .style("cursor", "pointer")
                    .on("mouseover", function (event, d) {
                        const leafIds = d.leaves().map(l => l.data.id.replace(/\s+/g, ''));
                        const leafNames = d.leaves().map(l => l.data.id);

                        links.style("stroke", l => d.descendants().includes(l.target) ? "var(--accent)" : "var(--border)")
                            .style("stroke-width", l => d.descendants().includes(l.target) ? "2.5px" : "1.5px");

                        d3.selectAll(`.cell-${metricType}`).style("opacity", 0.08);
                        leafIds.forEach(id => d3.selectAll(`.cell-${metricType}-${id}`).style("opacity", 1));

                        showTooltip(`<strong>${metricType} Cluster</strong><br/>${leafNames.join(", ")}`, event);
                        updateClusterPanel(panelId, metricType, leafNames, phasedData, countryColors, phases, events);
                    })
                    .on("mouseout", function () {
                        links.style("stroke", "var(--border)").style("stroke-width", "1.5px");
                        d3.selectAll(`.cell-${metricType}`).style("opacity", 1);
                        hideTooltip();
                    });
            };

            // ============================================================
            // SIDE PANEL RENDERER
            // ============================================================
            const updateClusterPanel = (panelId, metricType, leafNames, phasedData, countryColors, phases, events) => {
                const panel = d3.select(`#${panelId}`);
                panel.selectAll(".dendro-panel-empty").remove();
                panel.selectAll(".panel-content").remove();

                const content = panel.append("div").attr("class", "panel-content");

                const tagRow = content.append("div").style("display", "flex").style("flex-wrap", "wrap").style("gap", "6px").style("margin-bottom", "14px");
                leafNames.forEach(name => {
                    tagRow.append("span")
                        .style("background", countryColors(name) + "22")
                        .style("border", `1px solid ${countryColors(name)}55`)
                        .style("color", countryColors(name))
                        .style("font-family", "'IBM Plex Mono', monospace")
                        .style("font-size", "10px")
                        .style("padding", "2px 8px")
                        .style("border-radius", "2px")
                        .text(name);
                });

                const pmW = 240, pmH = 90;
                const margin = { top: 18, right: 8, bottom: 22, left: 28 };
                const innerW = pmW - margin.left - margin.right;
                const innerH = pmH - margin.top - margin.bottom;

                phases.forEach(p => {
                    content.append("div")
                        .style("font-family", "'IBM Plex Mono', monospace")
                        .style("font-size", "9px")
                        .style("color", "var(--text-dim)")
                        .style("text-transform", "uppercase")
                        .style("letter-spacing", "0.08em")
                        .style("margin-bottom", "4px")
                        .text(p.shortName + ": " + p.name.replace(/^P\d+: /, ''));

                    const svgEl = content.append("svg")
                        .attr("width", pmW).attr("height", pmH)
                        .style("display", "block").style("margin-bottom", "10px")
                        .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

                    const xScale = d3.scaleTime().domain([p.start, p.end]).range([0, innerW]);
                    const yScale = d3.scaleLinear().domain([0, 1]).range([innerH, 0]);

                    svgEl.append("g").attr("class", "axis").attr("transform", `translate(0,${innerH})`)
                        .call(d3.axisBottom(xScale).ticks(3).tickFormat(d3.timeFormat("%b %d")))
                        .call(g => g.select(".domain").attr("stroke", "var(--border)"));
                    svgEl.append("g").attr("class", "axis")
                        .call(d3.axisLeft(yScale).ticks(2))
                        .call(g => g.select(".domain").attr("stroke", "var(--border)"));

                    events.filter(e => e.date >= p.start && e.date <= p.end).forEach(e => {
                        const x = xScale(e.date);
                        svgEl.append("line").attr("class", "event-line").attr("x1", x).attr("x2", x).attr("y1", 0).attr("y2", innerH);
                    });

                    const lineGen = d3.line().defined(d => !isNaN(d.normVal)).x(d => xScale(d.date)).y(d => yScale(d.normVal)).curve(d3.curveMonotoneX);
                    const pIdx = phases.indexOf(p);
                    leafNames.forEach(c => {
                        const subset = phasedData.filter(d => d.country === c && d.type === metricType && d.phaseIdx === pIdx);
                        if (subset.length === 0) return;
                        svgEl.append("path").datum(subset)
                            .attr("fill", "none")
                            .attr("stroke", countryColors(c))
                            .attr("stroke-width", 1.5)
                            .attr("opacity", 0.85)
                            .attr("d", lineGen);
                    });
                });

                const leg = content.append("div").style("display", "flex").style("flex-wrap", "wrap").style("gap", "8px").style("margin-top", "4px");
                leafNames.forEach(name => {
                    leg.append("div").attr("class", "legend-item")
                        .html(`<div class="legend-swatch" style="background:${countryColors(name)}; width:16px; height:2px; border-radius:1px;"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim)">${name}</span>`);
                });
            };

            types.forEach((type, index) => {
                const activeCountries = (index > 0)
                    ? countries.filter(c => c.toLowerCase() !== "worldwide")
                    : countries;
                generateMetricDashboard(type, activeCountries);
            });

        }).catch(err => {
            console.error("Loading Error:", err);
            d3.select("body").append("div")
                .style("color", "var(--accent2)")
                .style("font-family", "'IBM Plex Mono', monospace")
                .style("padding", "20px")
                .text("⚠ Data loading error — check console for details.");
        });
    </script>
</body>
